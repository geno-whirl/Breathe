name: Release

# Push a tag such as v1.0 to build the signed release, attach the APK to a GitHub release and,
# when the Play secrets are set, upload the bundle to Google Play. See PUBLISHING.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Decode upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Set the UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD secrets (see PUBLISHING.md)."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "BREATHE_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and bundle
        env:
          BREATHE_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          BREATHE_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          BREATHE_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "breathe-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "breathe-${GITHUB_REF_NAME}.aab"

      - name: Release notes
        run: |
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes: add a changelog for versionCode $code."
            exit 1
          fi
          mkdir -p whatsnew
          cp "$notes" whatsnew/whatsnew-en-US
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: breathe-bundle
          path: |
            breathe-${{ github.ref_name }}.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.NOTES_FILE }}
          files: breathe-${{ github.ref_name }}.apk

      - name: Upload to Google Play
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.genowhirl.breathe
          releaseFiles: breathe-${{ github.ref_name }}.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          whatsNewDirectory: whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
